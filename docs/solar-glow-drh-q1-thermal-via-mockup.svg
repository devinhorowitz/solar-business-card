<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1000" height="660" fill="#0f1420"/>
  <text x="30" y="38" fill="#e8c15a" font-size="24" font-weight="700">Q1 pad-3 thermal vias — ADJACENT (not in-pad)</text>
  <text x="30" y="63" fill="#9fb3c8" font-size="14.5">GND vias in the solid pour hugging pad-3, ~0.3 mm off the edge (soldermask dam = no wicking). East side left clear for pads 1/2.</text>

  <!-- ============ LEFT: PLAN (B.Cu, looking at the back), 150 px/mm, board origin (44.0, 63.0) ============ -->
  <text x="70" y="105" fill="#7d99bd" font-size="13.5" font-weight="700">PLAN  (B.Cu · 150 px/mm)</text>
  <g transform="translate(70,120)">
    <!-- solid GND pour -->
    <rect x="-12" y="-12" width="560" height="612" rx="16" fill="#2d4870" opacity="0.5"/>
    <text x="20" y="585" fill="#7d99bd" font-size="12.5">solid GND pour (B.Cu), pad-3 = zone_connect solid</text>

    <!-- PV2 cell edge at board x46.4 -> local x=360 -->
    <line x1="360" y1="-12" x2="360" y2="600" stroke="#e0a0a0" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="352" y="8" fill="#e0a0a0" font-size="11.5" text-anchor="end">PV2 cell edge (x46.4)</text>
    <text x="366" y="8" fill="#8fd0a0" font-size="11.5">clear of cell &#8594;</text>

    <!-- pad3 GND: board x[45.2,46.2] y[64.3,65.7] -> local x[180,330] y[195,405] -->
    <rect x="180" y="195" width="150" height="210" rx="37" fill="#5b83b4" stroke="#9ec1ef" stroke-width="2"/>
    <text x="255" y="307" fill="#dce9ff" font-size="18" font-weight="700" text-anchor="middle">3 GND</text>

    <!-- pad1 CLBASE (46.9,64.5) 0.4x0.5 -> x[405,465] y[187,262] ; pad2 VS (46.9,65.5) -> y[337,412] -->
    <rect x="405" y="187" width="60" height="75" rx="7" fill="#7a6b9a" stroke="#c7b8e0" stroke-width="1.5"/>
    <text x="435" y="220" fill="#efe8ff" font-size="11" text-anchor="middle">1</text>
    <text x="435" y="234" fill="#efe8ff" font-size="9.5" text-anchor="middle">CLBASE</text>
    <rect x="405" y="337" width="60" height="75" rx="7" fill="#7a6b9a" stroke="#c7b8e0" stroke-width="1.5"/>
    <text x="435" y="372" fill="#efe8ff" font-size="11" text-anchor="middle">2</text>
    <text x="435" y="386" fill="#efe8ff" font-size="9.5" text-anchor="middle">VS</text>
    <text x="478" y="300" fill="#c7b8e0" font-size="11" transform="rotate(90 478 300)" text-anchor="middle">different nets &#8212; keep clear</text>

    <!-- vias: pad r45 (0.6mm), drill r22.5 (0.3mm). W col + N pair + S pair -->
    <g>
      <!-- west (90,240)(90,360) -->
      <g transform="translate(90,240)"><circle r="45" fill="#caa23c"/><circle r="22.5" fill="#0f1420"/></g>
      <g transform="translate(90,360)"><circle r="45" fill="#caa23c"/><circle r="22.5" fill="#0f1420"/></g>
      <!-- north/top (217.5,105)(292.5,105) -->
      <g transform="translate(217.5,105)"><circle r="45" fill="#caa23c"/><circle r="22.5" fill="#0f1420"/></g>
      <g transform="translate(292.5,105)"><circle r="45" fill="#caa23c"/><circle r="22.5" fill="#0f1420"/></g>
      <!-- south/bottom (217.5,495)(292.5,495) -->
      <g transform="translate(217.5,495)"><circle r="45" fill="#caa23c"/><circle r="22.5" fill="#0f1420"/></g>
      <g transform="translate(292.5,495)"><circle r="45" fill="#caa23c"/><circle r="22.5" fill="#0f1420"/></g>
    </g>

    <!-- mask-gap callout: gap between west via (east edge x135) and pad3 (west edge x180) -->
    <line x1="135" y1="240" x2="180" y2="240" stroke="#e8c15a" stroke-width="1.4"/>
    <line x1="135" y1="232" x2="135" y2="248" stroke="#e8c15a" stroke-width="1.4"/>
    <line x1="180" y1="232" x2="180" y2="248" stroke="#e8c15a" stroke-width="1.4"/>
    <text x="30" y="205" fill="#e8c15a" font-size="11.5">~0.3 mm</text>
    <text x="30" y="219" fill="#e8c15a" font-size="11.5">mask dam</text>

    <!-- F.Cu flood east arrow -->
    <g stroke="#b5442f" stroke-width="3" fill="none" marker-end="url(#af)">
      <line x1="470" y1="470" x2="545" y2="470"/>
    </g>
    <text x="360" y="470" fill="#e79b86" font-size="11.5">F.Cu flood floods east &#8594;</text>

    <!-- via legend -->
    <text x="20" y="560" fill="#caa23c" font-size="12">via 0.30 drill / 0.60 pad, GND, tented</text>
  </g>

  <!-- ============ RIGHT-TOP: STACK cross-section (adjacent via) ============ -->
  <text x="660" y="105" fill="#7d99bd" font-size="13.5" font-weight="700">STACK  (heat goes lateral, then up)</text>
  <g transform="translate(660,120)">
    <rect x="0" y="0" width="300" height="30" fill="#b5442f"/>
    <text x="150" y="20" fill="#ffe1d8" font-size="12" font-weight="700" text-anchor="middle">F.Cu GND flood (NEW)</text>
    <rect x="0" y="30" width="300" height="60" fill="#8a7d4a"/>
    <text x="292" y="65" fill="#efe7c9" font-size="11" text-anchor="end">0.6 mm FR4</text>
    <rect x="0" y="90" width="300" height="18" fill="#3f6ea5"/>
    <!-- pad3 segment (left) + pour continues right -->
    <rect x="20" y="88" width="90" height="22" fill="#5b83b4" stroke="#9ec1ef" stroke-width="1"/>
    <text x="65" y="103" fill="#dce9ff" font-size="10.5" text-anchor="middle">pad3</text>
    <text x="215" y="103" fill="#cfe0f2" font-size="10.5" text-anchor="middle">solid pour</text>
    <!-- adjacent via barrel (offset to the right of pad3, in the pour) -->
    <rect x="150" y="0" width="13" height="108" fill="#caa23c"/>
    <text x="156" y="126" fill="#caa23c" font-size="10.5" text-anchor="middle">via</text>
    <!-- Q1 body under pad3 -->
    <rect x="35" y="110" width="70" height="34" rx="3" fill="#1a1a1a" stroke="#555"/>
    <text x="70" y="131" fill="#cfcfcf" font-size="11" text-anchor="middle">Q1</text>
    <!-- heat arrows: up into pad3, lateral, up the via, into flood -->
    <g stroke="#e8c15a" stroke-width="2.4" fill="none" marker-end="url(#ah)">
      <line x1="70" y1="130" x2="70" y2="100"/>
      <line x1="80" y1="99" x2="150" y2="99"/>
      <line x1="156" y1="92" x2="156" y2="34"/>
    </g>
    <text x="0" y="172" fill="#9fb3c8" font-size="12">Q1 &#8594; pad3 &#8594; (short lateral in solid pour) &#8594; via &#8594; F.Cu</text>
    <text x="0" y="190" fill="#9fb3c8" font-size="12">&#952;JA ~206 &#8594; ~90 &#176;C/W  (in spec at 85 &#176;C amb)</text>
  </g>

  <!-- ============ RIGHT-BOTTOM: NOTES ============ -->
  <g transform="translate(660,350)" font-size="13">
    <text x="0" y="0" fill="#e8c15a" font-weight="700">Recipe</text>
    <text x="0" y="22" fill="#cdd9e6">1.  pad-3: zone_connect thermal &#8594; solid</text>
    <text x="0" y="42" fill="#cdd9e6">2.  4&#8211;6 vias, 0.30 drill / 0.60 pad, GND, tented</text>
    <text x="0" y="60" fill="#9fb3c8" font-size="11.5">     ~0.3 mm off pad-3 (mask web = no wicking)</text>
    <text x="0" y="80" fill="#cdd9e6">3.  place on W / N / S of pad-3; skip E (pads 1,2)</text>
    <text x="0" y="100" fill="#cdd9e6">4.  F.Cu GND flood over them, biased E into the</text>
    <text x="0" y="118" fill="#9fb3c8" font-size="11.5">     x46.4&#8211;50.3 clear strip (off the cell)</text>
    <text x="0" y="146" fill="#e8c15a" font-weight="700">Clearance</text>
    <text x="0" y="168" fill="#cdd9e6">vias are GND like pad-3 &#8594; no pad-to-via rule;</text>
    <text x="0" y="186" fill="#cdd9e6">only clearance that matters is to CLBASE / VS.</text>
  </g>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#e8c15a"/></marker>
    <marker id="af" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#b5442f"/></marker>
  </defs>
</svg>
