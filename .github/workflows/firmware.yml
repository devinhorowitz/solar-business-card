# .github/workflows/firmware.yml — compile the AVR64EA28 firmware on every change.
# Turns the register-verified firmware into a checked build: fetch Microchip's
# AVR toolchain + the AVR-Ex device pack (the EA lives in AVR-Ex_DFP, not
# AVR-Dx_DFP), run `make`, upload the hex.
#
# NOTE: the toolchain download is Microchip's WAF-protected server; the Referer
# header below is what gets past its 403. If that ever breaks, the documented
# fallback is `apt-get install gcc-avr avr-libc` (Atmel-patched builds handle
# avr64ea28 via the DFP's device-specs) — see firmware/README.md "Install the toolchain".
name: Firmware build

on:
  push:
    paths:
      - 'firmware/**'
      # the size gate reads the ELF this job builds; an edit to the gate must re-run it
      # (the #132 gap class: a checker edit that triggers nothing checks nothing)
      - 'scripts/check_fw_size.py'
      # same for the three `make check` gates: they live in scripts/, outside firmware/**
      - 'scripts/fw_lint.py'
      - 'scripts/fw_erratum_scan.py'
      - 'scripts/fw_prove.py'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'scripts/check_fw_size.py'
      - 'scripts/fw_lint.py'
      - 'scripts/fw_erratum_scan.py'
      - 'scripts/fw_prove.py'
      - '.github/workflows/firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs: a tag is mutable, and both of these run with the
      # repo checked out. The toolchain below is already pinned by version, so pinning
      # these makes the whole job reproducible.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Fetch AVR toolchain + AVR-Ex device pack
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          mkdir -p "$HOME/avr" && cd "$HOME/avr"
          curl -fsSL --retry 3 --retry-delay 5 -A "$UA" -H 'Referer: https://www.microchip.com/' \
            -o tc.tar.gz \
            'https://ww1.microchip.com/downloads/aemDocuments/documents/DEV/ProductDocuments/SoftwareTools/avr8-gnu-toolchain-3.7.0.1796-linux.any.x86_64.tar.gz'
          tar xzf tc.tar.gz
          curl -fsSL --retry 3 --retry-delay 5 -o dfp.atpack \
            'https://packs.download.microchip.com/Microchip.AVR-Ex_DFP.2.12.239.atpack'
          mkdir -p AVR-Ex_DFP && (cd AVR-Ex_DFP && unzip -oq ../dfp.atpack)
          echo "$HOME/avr/$(ls -d avr8-gnu-toolchain-*/ | head -1)bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set -euo pipefail
          avr-gcc --version | head -1
          # WERROR=1: warnings fail the build here (the README's "warning-free"
          # claim is a gate in CI, advisory locally -- see the Makefile knob).
          make -C firmware DFP="$HOME/avr/AVR-Ex_DFP" WERROR=1
          echo "----- size -----"
          avr-size firmware/solar-glow.elf

      # The README's measured size figure is GATED, not decorative: it went quietly
      # stale once (the "~2.4 KB / 6 B" that outlived the EA port), so a size-changing
      # edit must land with its README update in the same commit, or fail here.
      - name: Gate the README size figures against the build
        run: python3 scripts/check_fw_size.py firmware/solar-glow.elf

      # `make check` -- three readings of the firmware the compiler does not give, each a
      # GATE and each self-testing (firmware/README.md "Static checks"):
      #   fw_lint.py          cppcheck, told the real target (AVR8 model + the pack's header)
      #   fw_erratum_scan.py  erratum 2.2.3 guard, checked in the BINARY this job just built
      #   fw_prove.py         CBMC: glow-brightness chokepoint for every input; the deferred
      #                       STO sample service's loop/interrupt state machine for every
      #                       interleaving
      # The two apt packages are DELIBERATELY UNPINNED, against this repo's pinning doctrine
      # and for asic.yml's stated reason: neither tool touches the artifact this job
      # uploads -- the hex is built above, by the pinned toolchain, before they are even
      # installed -- so no output's reproducibility hangs on their version, and an apt pin
      # against `ubuntu-latest` turns a runner-image roll into rot. Versions are printed
      # instead. What a roll CAN do is change a verdict: a newer cppcheck may report
      # something this one does not. That lands as a red check on a firmware push, with the
      # finding in the log -- which is the right place for it to land.
      - name: Install the static-check tools (cppcheck, CBMC)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cppcheck cbmc
          echo "----- provenance -----"
          cppcheck --version
          cbmc --version
          python3 --version

      - name: Static checks (lint, erratum scan, proofs)
        run: make -C firmware DFP="$HOME/avr/AVR-Ex_DFP" WERROR=1 check

      - name: Upload firmware image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: solar-glow-firmware
          path: |
            firmware/solar-glow.hex
            firmware/solar-glow.elf
          if-no-files-found: error
