# .github/workflows/consistency.yml — drift guard for docs vs firmware vs board.
# Runs scripts/check_consistency.py (firmware pin contract, BOM parity, package-vs-land
# geometry, 3D model refs, generated mask art, doc imagery provenance, 3D model colours,
# and referenced-file existence) inside the
# KiCad 10 container so kicad-cli is on hand to export the schematic netlist and pcbnew
# is importable. Errors fail the build; doc-reference drift is reported as a warning.
#
# The image is pinned by digest for the same reason kibot.yml pins it — several of these
# checks are computed by KiCad itself (netlist export, pad geometry) or by shapely
# (check [6] regenerates the front mask art and compares), so a floating toolchain can
# change a verdict with no commit here to explain it. Keep this digest in step with
# .github/workflows/kibot.yml.
name: Consistency check

on:
  push:
    paths:
      - 'PCB/**'
      - 'firmware/board.h'
      # check [9] reads EVERY .md in the tree, so it has to trigger on every .md in the
      # tree. It used to list README.md and firmware/README.md by name, which meant an
      # un-generated image added to PCB/README.md or enclosure/README.md -- the two most
      # likely places -- would never have been checked at all.
      - '**.md'
      - 'scripts/check_consistency.py'
      # check [6] regenerates the mask art by importing this module, so a change to the
      # generator can make the committed board stale without the board file being touched.
      - 'scripts/mask_art.py'
      # check [10] imports this table and compares it against the STEP files.
      - 'scripts/part_colors.py'
      # check [13] imports this module and re-derives the coil's paper tune from the
      # routing — an edit to the coil math must re-gate the unchanged board.
      - 'scripts/nfc_coil.py'
      # check [17] imports this one and re-sets the card face's type from it, so a change
      # to the generator can make the committed board stale without the board being touched
      # — the same relationship [6] has with mask_art.py.
      - 'scripts/face_art.py'
      # ...and face_art gets its glyph fill from here, so this file reaches check [17] one
      # import further out. It is shared with the medallion engraver (which kibot.yml
      # triggers on for the same reason), and it is the file where the fill RULE lives —
      # the thing that decides whether an '8' has counters. An edit here changes the
      # committed board's mask art without PCB/** being touched at all.
      - 'scripts/glyphs.py'
      # check [19] imports panelize.stub_layer() to read the plating-bus stubs off the
      # board — the same fact the panel's tab spur is emitted from. An edit to that reader
      # changes what the check sees with no PCB/** in the diff.
      # check [21] imports this module to re-measure what stops a hand-placed supercap.
      # It owns BOTH the measurement and the ledger, so an edit here changes the verdict on
      # an unchanged board — the same relationship [6] has with mask_art.py and [19] with
      # panelize.py. Its sibling scripts/reflow_shim.py consumes that same ledger to prove
      # the index shim stands between each cap and the part it would otherwise shear.
      - 'scripts/cap_clearance.py'
      - 'scripts/reflow_shim.py'
      - 'scripts/panelize.py'
      # check [20] imports bom_split.build() -- the Supplier-P/N gate reads every BOM
      # line through it, so an edit to the splitter changes what the check sees with
      # no PCB/** in the diff.
      - 'scripts/bom_split.py'
      # check [9] parses the OUTS list out of kibot.yml to confirm that everything it calls
      # "automated" is something CI actually commits.
      - '.github/workflows/kibot.yml'
      # check [7] reads enclosure/part_heights.py and measures it against the board's
      # 3D models. Until 2026-07-29 nothing in CI triggered on enclosure/ at all.
      - 'enclosure/**'
      # the BOM master lives here since 2026-08-01 (was PCB/, covered by PCB/**) and the
      # package-vs-land check reads it — without this line a master edit checks nothing.
      - 'BOM/**'
      - '.github/workflows/consistency.yml'
  pull_request:
    paths:
      - 'PCB/**'
      - 'firmware/board.h'
      - '**.md'
      - 'scripts/check_consistency.py'
      - 'scripts/mask_art.py'
      - 'scripts/part_colors.py'
      - 'scripts/cap_clearance.py'
      - 'scripts/reflow_shim.py'
      - 'scripts/nfc_coil.py'
      - 'scripts/face_art.py'
      - 'scripts/glyphs.py'
      - 'scripts/panelize.py'
      - 'scripts/bom_split.py'
      - '.github/workflows/kibot.yml'
      - 'enclosure/**'
      - 'BOM/**'
      - '.github/workflows/consistency.yml'
  # THE RE-VERDICT TRIGGER (2026-08-06). A BOM-changing merge always went red here and
  # stayed red: this job runs on the merge sha against the PREVIOUS Generated/ (checks
  # [2]/[15] compare the CI BOM to the netlist), kibot then regenerates and commits back
  # with [skip ci] — so the healing commit never gets a verdict, and main's newest
  # consistency status is a transition error that no longer exists in the tree. Three
  # merges hit some flavour of this race (#195's, #200's, #201's). This trigger re-runs
  # the suite AFTER "PCB CI" completes on main — for workflow_run events GITHUB_SHA is
  # the default branch head at event time, which includes the commit-back — so the
  # verdict that sticks is the one measured against the tree as it actually is. The
  # push/pull_request runs above still fire first and still catch real drift early; a
  # red there followed by green here is the transition signature, and a red here is real.
  # No loop risk: this job pushes nothing, and PCB CI does not trigger on it.
  workflow_run:
    workflows: ["PCB CI"]
    types: [completed]
  # Manual re-verdict, for repainting main after an out-of-band fix.
  workflow_dispatch:

jobs:
  check:
    # For the re-verdict trigger, run only for successful PCB CI runs on main — a failed
    # kibot run means no commit-back landed, so there is nothing new to re-measure, and
    # branch runs get their verdict from the pull_request trigger instead.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto_full@sha256:dd3b846da945f204fa7b61916df34a99170b2a2095b49c3879cd96d414b8a7b8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      # check [17] sets the card face's type from the JetBrains Mono TTFs, and the KiCad
      # image does not carry matplotlib. Pinned to the version kibot.yml already installs
      # for the drawings, so the two jobs cannot render from different font machinery.
      #
      # --break-system-packages is REQUIRED HERE AND NOT IN kibot.yml, and the difference is
      # worth knowing before copying a pip line between the two. This job sets `container:`
      # at the job level, so every step runs INSIDE the KiCad image, whose Debian Python is
      # PEP 668 externally-managed and refuses a bare `pip install`. kibot.yml has no
      # `container:` -- it invokes KiCad through `docker run` and pip-installs on the host
      # runner, where the same line works untouched. The flag is safe in a throwaway CI
      # container and the version is pinned, so nothing floats.
      - name: Install the type-setting dependency
        run: python3 -m pip install --quiet --break-system-packages 'matplotlib==3.11.1'
      - name: Run consistency check
        run: python3 scripts/check_consistency.py
      # The shim gate is its own script rather than a consistency check because it asserts
      # something about an ARTIFACT (the cut plate), not about agreement between two files.
      # It shares cap_clearance's ledger, so it goes red on the same board moves.
      - name: Gate the reflow index shim
        run: python3 scripts/reflow_shim.py
