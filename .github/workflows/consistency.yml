# .github/workflows/consistency.yml — drift guard for docs vs firmware vs board.
# Runs scripts/check_consistency.py (firmware pin contract, BOM parity, package-vs-land
# geometry, 3D model refs, generated mask art, doc imagery provenance, 3D model colours,
# and referenced-file existence) inside the
# KiCad 10 container so kicad-cli is on hand to export the schematic netlist and pcbnew
# is importable. Errors fail the build; doc-reference drift is reported as a warning.
#
# The image is pinned by digest for the same reason kibot.yml pins it — several of these
# checks are computed by KiCad itself (netlist export, pad geometry) or by shapely
# (check [6] regenerates the front mask art and compares), so a floating toolchain can
# change a verdict with no commit here to explain it. Keep this digest in step with
# .github/workflows/kibot.yml.
name: Consistency check

on:
  push:
    paths:
      - 'PCB/**'
      - 'firmware/board.h'
      # check [9] reads EVERY .md in the tree, so it has to trigger on every .md in the
      # tree. It used to list README.md and firmware/README.md by name, which meant an
      # un-generated image added to PCB/README.md or enclosure/README.md -- the two most
      # likely places -- would never have been checked at all.
      - '**.md'
      - 'scripts/check_consistency.py'
      # check [6] regenerates the mask art by importing this module, so a change to the
      # generator can make the committed board stale without the board file being touched.
      - 'scripts/mask_art.py'
      # check [10] imports this table and compares it against the STEP files.
      - 'scripts/part_colors.py'
      # check [13] imports this module and re-derives the coil's paper tune from the
      # routing — an edit to the coil math must re-gate the unchanged board.
      - 'scripts/nfc_coil.py'
      # check [9] parses the OUTS list out of kibot.yml to confirm that everything it calls
      # "automated" is something CI actually commits.
      - '.github/workflows/kibot.yml'
      # check [7] reads enclosure/part_heights.py and measures it against the board's
      # 3D models. Until 2026-07-29 nothing in CI triggered on enclosure/ at all.
      - 'enclosure/**'
      # the BOM master lives here since 2026-08-01 (was PCB/, covered by PCB/**) and the
      # package-vs-land check reads it — without this line a master edit checks nothing.
      - 'BOM/**'
      - '.github/workflows/consistency.yml'
  pull_request:
    paths:
      - 'PCB/**'
      - 'firmware/board.h'
      - '**.md'
      - 'scripts/check_consistency.py'
      - 'scripts/mask_art.py'
      - 'scripts/part_colors.py'
      - 'scripts/nfc_coil.py'
      - '.github/workflows/kibot.yml'
      - 'enclosure/**'
      - 'BOM/**'
      - '.github/workflows/consistency.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto_full@sha256:dd3b846da945f204fa7b61916df34a99170b2a2095b49c3879cd96d414b8a7b8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Run consistency check
        run: python3 scripts/check_consistency.py
