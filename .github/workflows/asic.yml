name: ASIC RTL

# The DRH-1 companion-ASIC core (asic/) was the one tree in this repo with NO CI:
# `make sim`, `make synth` and `make gates` were entirely manual, so the RTL and its
# mutation-tested benches were unguarded against a toolchain bump in a way nothing else
# here is. That is a bad shape for work whose next step has a HARD DATE -- a Tiny Tapeout
# shuttle deadline -- because finding out the benches stopped passing during submission
# week is the expensive version of that discovery.
#
# COST. Measured on the real tree before this file was written: `make sim` (6 self-checking
# testbenches, Icarus) is 27 s and `make gates` (yosys synth + abc -g NAND) is 4 s, so ~31 s
# of actual work plus apt and checkout -- call it under two minutes. And it triggers ONLY on
# asic/**, so every other push in this repo pays nothing at all. Compare kibot's ~20 min.
#
# `asic/**.md` is EXCLUDED, the same lesson `PCB/**` learned on 2026-07-30: prose beside the
# source is not the source. A SPEC.md edit changes no RTL, so the sim result is identical and
# running it would be pure noise. (Written the day asic/README.md gained its pre-submission
# section, which is exactly the edit that should not have run a simulator.)

on:
  push:
    paths:
      - 'asic/**'
      - '!asic/**.md'
      - '.github/workflows/asic.yml'
  pull_request:
    paths:
      - 'asic/**'
      - '!asic/**.md'
      - '.github/workflows/asic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # DELIBERATELY UNPINNED, unlike everything else this repo runs in CI. The pinning
      # doctrine exists because DRC is a merge gate and Generated/ is a gerber set that goes
      # to a fab -- neither applies here: this job COMMITS NOTHING (asic/.gitignore covers
      # build/, *.vvp and both synth_*.txt), so there is no artifact whose reproducibility a
      # pin would protect. Pinning apt against ubuntu-latest would also convert a runner-image
      # roll into rot, which is strictly worse than the drift it prevents. Same call the
      # `xvfb` install in kibot.yml already makes.
      # The versions are PRINTED below instead, so a future failure can be diagnosed against
      # what actually ran rather than guessed at.
      - name: Install Icarus Verilog + yosys
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog yosys

      - name: Toolchain provenance
        run: |
          iverilog -V | head -1
          yosys -V

      # The real gate. Every bench is $fatal-armed and must print "TB PASS: <name>"; the
      # Makefile fails on a non-zero vvp exit AND on a missing TB PASS line, so a bench that
      # silently stops asserting cannot pass by going quiet.
      - name: Simulate — every testbench must pass
        run: make -C asic sim

      - name: Synthesise and size
        run: make -C asic gates

      # SPEC's "no latches" is a claim about the RTL, so it gets a gate rather than a comment.
      # Checked against the CELLS yosys actually emitted, not against warning text: a warning
      # string is upstream prose that can be reworded, while a $_DLATCH_ / $_SR_ in the netlist
      # is the thing itself. The cell COUNT is deliberately NOT gated -- it moves with the
      # yosys version, the same reason the mesh gate leaves triangle count alone. asic/README
      # owns the published number and says to re-derive it with `make gates`.
      - name: No inferred latches
        run: |
          if grep -qE '\$_(DLATCH|SR)_' asic/synth_nand.txt; then
            echo "::error::yosys inferred a latch or SR primitive — SPEC.md requires none."
            grep -nE '\$_(DLATCH|SR)_' asic/synth_nand.txt
            exit 1
          fi
          echo "no \$_DLATCH_ / \$_SR_ cells in the mapped netlist"

      # THE RETIRED NAME MUST STAY RETIRED. Until 2026-08-19 this core called its brownout
      # STATUS output `chg_dis` -- the same name as the card's own CHG_DIS_G net (PA4 -> Q2
      # gate), which is the opposite kind of thing: a charge-INHIBIT CONTROL, driven from the
      # FD handler to quiet the DC-DC for an NFC read. Tie them together and a brownout
      # disables harvest exactly when the tank is empty -- the cold-start deadlock R18's gate
      # pulldown exists to prevent, re-created in silicon -- and the miswire LOOKS CORRECT,
      # because the names match. That is a defect no bench here can fail on: tb/ checks the
      # RTL against its contract, and the contract was what was wrong. A rename is worth only
      # as much as whatever keeps it renamed, so the old name is banned in SOURCE rather than
      # merely documented. FRONT_SIDE-snapshot shape: a deliberate return updates this gate
      # in the same commit.
      #
      # IT BANS THE IDENTIFIER, NOT THE WORD, and that distinction is the whole design.
      # rtl/wake_fsm.v's header NAMES chg_dis to explain why it is gone -- the first cut of
      # this gate was a bare `grep chg_dis` and went red on a clean tree against exactly that
      # sentence, i.e. it forbade documenting the thing it enforces. So comments are stripped
      # (line-count preserved, so reported line numbers are real) before the scan, and the
      # stripper SELF-TESTS against both cases every run: a prose mention must stay green, a
      # declaration must go red. If it ever stops telling them apart, the gate fails itself
      # rather than going quietly permissive.
      - name: The retired brownout-signal name stays retired
        run: |
          python3 - <<'PY'
          import pathlib, sys

          RETIRED = "chg_dis"

          def strip_comments(src):
              """Blank // and /* */ comments, preserving line count and offsets."""
              out, i, n, blk = [], 0, len(src), False
              while i < n:
                  if blk:
                      if src.startswith("*/", i):
                          out.append("  "); i += 2; blk = False
                      else:
                          out.append("\n" if src[i] == "\n" else " "); i += 1
                  elif src.startswith("/*", i):
                      out.append("  "); i += 2; blk = True
                  elif src.startswith("//", i):
                      while i < n and src[i] != "\n":
                          out.append(" "); i += 1
                  else:
                      out.append(src[i]); i += 1
              return "".join(out)

          def hits(src):
              return [(k, l) for k, l in enumerate(strip_comments(src).splitlines(), 1)
                      if RETIRED in l]

          # -- self-test: the gate must distinguish a mention from an identifier ----------
          PROSE = "/*\n * it was called %s until 2026-08-19.\n */\nassign a = b;  // not %s\n" % (RETIRED, RETIRED)
          CODE  = "module m(output reg %s);  /* the tell */\nendmodule\n" % RETIRED
          if hits(PROSE):
              print("::error::gate self-test failed: a prose mention was flagged"); sys.exit(1)
          if not hits(CODE):
              print("::error::gate self-test failed: a declaration was NOT flagged"); sys.exit(1)
          print("self-test ok: prose mention green, declaration red")

          # -- the scan --------------------------------------------------------------------
          bad = []
          for f in sorted(pathlib.Path("asic").glob("*/*.v")):
              for k, l in hits(f.read_text()):
                  bad.append("%s:%d: %s" % (f, k, l.strip()))
          if bad:
              print("::error::%s is retired -- the brownout status output is named 'brownout'. See asic/rtl/wake_fsm.v." % RETIRED)
              print("\n".join(bad))
              sys.exit(1)
          print("no %s identifier in asic/rtl or asic/tb" % RETIRED)
          PY

      # A tri-state outside the SDA pad would be a real find: it is the one place the design
      # is allowed one (SPEC "no tri-state except the SDA pad in i2c_master"), and yosys says
      # plainly that its tri-state support is limited. Reported, never fatal -- the message is
      # upstream text and gating on it would be gating on prose.
      # (name quoted: an unquoted colon inside a YAML scalar ends the key, and this file
      # failed to parse exactly that way while being written.)
      - name: "Tri-state sites (expected: i2c_master's SDA pad only)"
        if: always()
        run: |
          yosys -p "read_verilog asic/rtl/*.v; hierarchy -top drh1_top" 2>&1 \
            | grep -i "tri-state" || echo "none reported"
