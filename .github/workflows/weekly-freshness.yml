# .github/workflows/weekly-freshness.yml — the weekly canary + drift report.
#
# Everything CI runs here is pinned ON PURPOSE (CLAUDE.md: DRC is a merge gate and
# Generated/ goes to a fab), and pins have two failure modes that a push-triggered
# CI can never see, because a repo nobody pushes to runs no CI at all:
#   1. ROT — the pinned artifact stops being fetchable (the KiCad container digest
#      unpullable, Microchip's WAF-guarded toolchain URL dead, a pack withdrawn),
#      discovered months later on the first innocent push, which then fails for
#      reasons that have nothing to do with the change being pushed.
#   2. DRIFT — upstream moves on (new KiCad image, new AVR-Ex DFP, new pip
#      releases) and the gap between pinned and current silently widens until an
#      upgrade becomes an event instead of a chore.
# This workflow runs WEEKLY regardless of pushes: it re-proves the pinned world
# still builds (canary), measures how far upstream has moved (sweep), and writes
# the result to a single standing issue ("Weekly freshness report") that gets
# UPDATED in place — one issue, current state, not a weekly pile.
#
# THE DOCTRINE HOLDS: nothing here ever moves a pin automatically. Rot fails the
# job loudly (red = broken world, act now); drift is report-only (the pin is a
# decision, not an oversight). The one bridge to action is deliberate: dispatch
# this workflow with bump_kicad=true and it opens a DRAFT PR moving the KiCad
# digest in both workflows (they must stay in step) — merging that PR triggers
# the full kibot regen, and the merge run's Generated/ diff IS the upgrade's
# blast radius, exactly as CLAUDE.md prescribes. NOTE: PRs opened with the
# workflow token don't start their own CI (a GitHub guard against workflow
# loops) — close/reopen the PR or push an empty commit to it to run checks
# pre-merge, or read the blast radius off the merge run.
name: Weekly freshness

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — off the top-of-hour stampede
  workflow_dispatch:
    inputs:
      bump_kicad:
        description: 'Open a draft PR bumping the pinned KiCad digest to current :latest'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ---- canary 1: the firmware world still exists and still builds ----
  firmware-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Fetch the PINNED toolchain + DFP (rot check is the point)
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          mkdir -p "$HOME/avr" && cd "$HOME/avr"
          curl -fsSL --retry 3 --retry-delay 5 -A "$UA" -H 'Referer: https://www.microchip.com/' \
            -o tc.tar.gz \
            'https://ww1.microchip.com/downloads/aemDocuments/documents/DEV/ProductDocuments/SoftwareTools/avr8-gnu-toolchain-3.7.0.1796-linux.any.x86_64.tar.gz'
          tar xzf tc.tar.gz
          curl -fsSL --retry 3 --retry-delay 5 -o dfp.atpack \
            'https://packs.download.microchip.com/Microchip.AVR-Ex_DFP.2.12.239.atpack'
          mkdir -p AVR-Ex_DFP && (cd AVR-Ex_DFP && unzip -oq ../dfp.atpack)
          echo "$HOME/avr/$(ls -d avr8-gnu-toolchain-*/ | head -1)bin" >> "$GITHUB_PATH"
      - name: Build warning-free + gate the README size figures
        run: |
          set -euo pipefail
          make -C firmware DFP="$HOME/avr/AVR-Ex_DFP" WERROR=1
          python3 scripts/check_fw_size.py firmware/solar-glow.elf

  # ---- canary 2: the pinned KiCad container still pulls and the tree is still consistent ----
  consistency-canary:
    runs-on: ubuntu-latest
    # Keep this digest in step with kibot.yml / consistency.yml (the sweep below flags a mismatch).
    container: ghcr.io/inti-cmnb/kicad10_auto_full@sha256:dd3b846da945f204fa7b61916df34a99170b2a2095b49c3879cd96d414b8a7b8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Run the consistency suite on the unchanged tree
        run: python3 scripts/check_consistency.py

  # ---- the sweep: measure pin-vs-upstream drift, report to the standing issue ----
  sweep:
    runs-on: ubuntu-latest
    needs: [firmware-canary, consistency-canary]
    if: always()   # a red canary is exactly when the report matters most
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Compose the drift report
        id: report
        # THE `shell:` LINE IS LOAD-BEARING -- do not delete it as noise.
        # Actions' default is `bash -e {0}`, and `-e` on the invocation CANNOT be undone by a
        # `set +e` inside the script. This step's whole design is that every probe is
        # best-effort and a failure becomes a report ROW; with the default shell, plus the
        # `pipefail` below, the first probe whose pipeline returned non-zero killed the job
        # instead. That is not theory: on 2026-08-10 this job died 1.6 s in, having emitted
        # ZERO rows -- while both canaries were green and nothing had actually rotted. A red
        # `sweep` is also the one thing that must not happen, because the doctrine's only
        # signal is "red canary = rot = act now"; a reporter that can go red destroys it.
        shell: bash {0}
        run: |
          set -uo pipefail   # no -e ON PURPOSE (see the shell: line above) -- probes report, never abort
          R=report.md
          {
            echo "# Weekly freshness report"
            echo
            echo "_Updated $(date -u +'%Y-%m-%d %H:%M UTC') by \`.github/workflows/weekly-freshness.yml\` run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
            echo
            echo "**Canaries this run:** firmware-canary = **${{ needs.firmware-canary.result }}**, consistency-canary = **${{ needs.consistency-canary.result }}** (failure = the pinned world broke: act now, that is rot, not drift)."
            echo
            echo "<!--PROBE-BANNER-->"
            echo
            echo "| component | pinned | upstream now | verdict |"
            echo "|---|---|---|---|"
          } > "$R"

          # KiCad container digest (pinned in kibot.yml + consistency.yml, kept in step)
          PIN_KICAD=$(grep -oh 'kicad10_auto_full@sha256:[0-9a-f]*' .github/workflows/kibot.yml | head -1 | cut -d@ -f2)
          PIN_KICAD2=$(grep -oh 'kicad10_auto_full@sha256:[0-9a-f]*' .github/workflows/consistency.yml | head -1 | cut -d@ -f2)
          LATEST_KICAD=$(docker buildx imagetools inspect ghcr.io/inti-cmnb/kicad10_auto_full:latest 2>/dev/null | awk '/^Digest:/{print $2; exit}')
          if [ -z "$LATEST_KICAD" ]; then
            echo "| KiCad container (\`kicad10_auto_full\`) | \`${PIN_KICAD:0:19}…\` | probe failed | ⚠️ could not inspect :latest |" >> "$R"
          elif [ "$PIN_KICAD" = "$LATEST_KICAD" ]; then
            echo "| KiCad container (\`kicad10_auto_full\`) | \`${PIN_KICAD:0:19}…\` | same | ✅ current |" >> "$R"
          else
            echo "| KiCad container (\`kicad10_auto_full\`) | \`${PIN_KICAD:0:19}…\` | \`${LATEST_KICAD:0:19}…\` | 🔻 drifted — dispatch this workflow with \`bump_kicad=true\` for a draft respin PR |" >> "$R"
          fi
          if [ "$PIN_KICAD" != "$PIN_KICAD2" ]; then
            echo "| KiCad digest parity (kibot vs consistency) | — | — | ❌ THE TWO WORKFLOWS DISAGREE — fix before anything else |" >> "$R"
          fi
          echo "kicad_pin=$PIN_KICAD"     >> "$GITHUB_OUTPUT"
          echo "kicad_latest=$LATEST_KICAD" >> "$GITHUB_OUTPUT"

          # AVR-Ex DFP (pinned by version in firmware.yml + this file)
          PIN_DFP=$(grep -oh 'AVR-Ex_DFP\.[0-9.]*\.atpack' .github/workflows/firmware.yml | head -1 | sed 's/AVR-Ex_DFP\.//;s/\.atpack//')
          LATEST_DFP=$(curl -fsSL https://packs.download.microchip.com/index.idx 2>/dev/null | grep -o 'AVR-Ex_DFP[^>]*version="[0-9.]*"' | grep -o '[0-9][0-9.]*' | sort -uV | tail -1)
          if [ -z "$LATEST_DFP" ]; then
            echo "| AVR-Ex DFP | $PIN_DFP | probe failed | ⚠️ pack index unreachable/format changed |" >> "$R"
          elif [ "$PIN_DFP" = "$LATEST_DFP" ]; then
            echo "| AVR-Ex DFP | $PIN_DFP | same | ✅ current |" >> "$R"
          else
            echo "| AVR-Ex DFP | $PIN_DFP | $LATEST_DFP | 🔻 drifted — bump the URL in firmware.yml + weekly-freshness.yml, rebuild proves it |" >> "$R"
          fi

          # avr8 toolchain: no version feed exists; the firmware-canary already proved the URL alive
          echo "| avr8-gnu-toolchain | 3.7.0.1796 | (no upstream feed) | ℹ️ URL-alive is proven by firmware-canary |" >> "$R"

          # A HOLD MUST BE ABLE TO EXPIRE. The classifier that decides that is exercised on
          # every run against the two real historical states of the numpy hold, so it cannot
          # rot into always-agreeing -- the same shape as check [20]'s ledger. A failure here
          # is a ROW, never a red job: red belongs to the canaries and means rot.
          if python3 scripts/pin_hold.py --self-test > /tmp/pinhold-selftest.txt 2>&1; then :; else
            echo "| hold-expiry self-test | — | — | ❌ CLASSIFIER SELF-TEST FAILED — every ⏸️/🔓 verdict below is untrustworthy: $(tr '\n|' ';_' < /tmp/pinhold-selftest.txt | cut -c1-200) |" >> "$R"
          fi

          # pip pins (self-discovered from the workflows, so a new pin joins automatically)
          for spec in $(grep -rhoE "[a-zA-Z0-9_-]+==[0-9][0-9.]*" .github/workflows/*.yml | sort -u); do
            pkg=${spec%%==*}; pin=${spec##*==}
            # The marker NAMES its package -- `# HELD <pkg> BY <blocker>: <reason>`. A bare
            # `# HELD:` was tried first and bound to every pin sharing the line: one comment
            # on the render install claimed pillow, shapely and vtk were held too, which
            # would have hidden real drift on three pins to explain one.
            # ...and it must sit ON THE PIN LINE. Matching the marker anywhere let the
            # prose ABOVE the pin win on file order, so the reported reason was a
            # sentence about the mechanism rather than the reason itself.
            # ...and since 2026-08-17 it must NAME THE BLOCKER, because a hold that cannot be
            # re-derived is a silence that never ends. numpy sat "held on purpose" for two
            # weeks after numba 0.67.0 lifted the numpy<2.5 ceiling that justified it: the
            # marker was unconditional, so the row reported the same reassurance every Monday
            # while the reason underneath it had ceased to exist. The blocker's live metadata
            # is now re-read each run and the verdict re-decided.
            heldraw=$(grep -rhoE "$pkg==[0-9][0-9.]*.*# *HELD +$pkg( +BY +[A-Za-z0-9._-]+)? *: *[^\"']*" .github/workflows/*.yml | head -1)
            held=$(printf '%s' "$heldraw" | sed -E 's/.*# *HELD +[A-Za-z0-9_-]+( +BY +[A-Za-z0-9._-]+)? *: *//')
            blocker=$(printf '%s' "$heldraw" | sed -nE 's/.*# *HELD +[A-Za-z0-9_-]+ +BY +([A-Za-z0-9._-]+) *:.*/\1/p')
            latest=$(curl -fsSL "https://pypi.org/pypi/$pkg/json" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null)
            if [ -z "$latest" ]; then
              echo "| pip \`$pkg\` | $pin | probe failed | ⚠️ PyPI unreachable |" >> "$R"
            elif [ "$pin" = "$latest" ]; then
              echo "| pip \`$pkg\` | $pin | same | ✅ current |" >> "$R"
            elif [ -n "$heldraw" ] && [ -z "$blocker" ]; then
              # Unauditable BY CONSTRUCTION -- exactly the finding the action loop below
              # raises for a SHA pinned with no `# vN` comment to check it against.
              echo "| pip \`$pkg\` | $pin | $latest | ⚠️ hold names no blocker (\`# HELD $pkg BY <blocker>: …\`) — nothing to re-check it against |" >> "$R"
            elif [ -n "$heldraw" ]; then
              # A pin can be BELOW latest on purpose. Reporting that as drift forever trains
              # the reader to skip the row, which is how a real drift gets missed next to a
              # fake one. But the hold only survives if the blocker still says so TODAY.
              # `cut` (tab-delimited by default) rather than a ${..%%..} on a literal tab:
              # a raw tab is invisible here and this file is a YAML block scalar.
              hv=$(python3 scripts/pin_hold.py --check "$pkg" "$latest" "$blocker" 2>/dev/null)
              verdict=$(printf '%s' "$hv" | cut -f1)
              detail=$(printf '%s' "$hv" | cut -f2-)
              if [ "$verdict" = "HELD" ]; then
                echo "| pip \`$pkg\` | $pin | $latest | ⏸️ held on purpose — $held (re-checked: $detail) |" >> "$R"
              elif [ "$verdict" = "EXPIRED" ]; then
                echo "| pip \`$pkg\` | $pin | $latest | 🔓 HOLD EXPIRED — $detail. Drop the \`# HELD\` marker and bump. |" >> "$R"
              else
                echo "| pip \`$pkg\` | $pin | $latest | ⚠️ hold unverified — ${detail:-pin_hold.py produced no verdict} |" >> "$R"
              fi
            else
              echo "| pip \`$pkg\` | $pin | $latest | 🔻 drifted (render pins: remember VTK pixels differ across versions — a bump churns Generated/) |" >> "$R"
            fi
          done

          # Pinned action SHAs. The `# vN` comment beside each pin is the claim about which
          # release that SHA is, so comparing it to the latest release is what turns this
          # row from a note into a verdict.
          #
          # Until 2026-08-03 this loop GREPPED THE COMMENT AWAY and then printed "compare
          # against the `# vN` comment in the workflow" -- an instruction for a human to
          # perform, by hand, a comparison the script was already holding both sides of.
          # Nobody performed it. Both actions sat pinned at v4 while upstream was v7.0.1 --
          # three majors of drift, reported every week as ℹ️ informational, which is the
          # one verdict that asks for nothing. Drift is meant to be visible and deliberate
          # here, not silently reclassified as a note.
          #
          # A pin with NO version comment is its own finding: unauditable by construction,
          # because there is no claim to check the upstream tag against.
          grep -rhoE "uses: [A-Za-z0-9_./-]+@[0-9a-f]{40}([[:space:]]+#[[:space:]]*v[0-9][0-9.]*)?" \
              .github/workflows/*.yml \
            | sed -E 's/^uses: //; s/[[:space:]]+#[[:space:]]*/ /' | sort -u \
            | while read -r pin claim; do
              repo=${pin%%@*}; sha=${pin##*@}
              latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null)
              if [ -z "$claim" ]; then
                verdict="⚠️ pin carries no \`# vN\` comment — nothing to audit it against"
              elif [ -z "$latest" ]; then
                verdict="ℹ️ upstream probe failed — re-run before concluding anything"
              else
                pv=${claim#v}; pv=${pv%%.*}
                lv=${latest#v}; lv=${lv%%.*}
                if [ "$pv" = "$lv" ]; then
                  verdict="✅ current (\`$claim\`)"
                else
                  verdict="🔻 pinned \`$claim\`, upstream \`$latest\` — $((lv - pv)) major(s) behind"
                fi
              fi
              echo "| action \`$repo\` | \`${sha:0:12}…\` ${claim:+\`$claim\`} | ${latest:-probe failed} | $verdict |" >> "$R"
            done

          {
            echo
            echo "**Doctrine reminder:** pins move only by deliberate commit. Rot (red canary) = act now."
            echo "Drift (🔻) = schedule a bump whose CI diff you actually read — for KiCad, the merge run's"
            echo "\`Generated/\` diff is the blast radius."
            echo
            echo "A **⏸️ held** pin re-derives its reason from the blocker's live metadata every run, so"
            echo "**🔓 HOLD EXPIRED** means the thing that justified the hold is gone upstream and the pin"
            echo "is now free to move — treat it as drift you already have the answer to."
          } >> "$R"

          # ---- make a DEGRADED sweep legible ------------------------------------------------
          # A probe that could not reach upstream reports "probe failed" in its own row, which is
          # correct and easy to miss in a table of twenty. The failure mode that matters is
          # reading a failed probe as "no drift" -- silence where there should be a question. So
          # the count is hoisted to the top of the issue body, above the table, and says what an
          # unreached probe MEANS rather than just that it happened.
          #
          # The job stays GREEN when probes fail, deliberately. Red is reserved for the canaries,
          # where it means rot. A reporter that can also go red is what sent a human chasing a
          # rotted pin on 2026-08-10 when nothing had rotted.
          # Every banner is built with printf and \n escapes rather than a multi-line shell
          # string: a continuation line starting in column 1 ENDS the YAML block scalar, and
          # indenting it instead would put leading spaces in front of the `>` and turn the
          # blockquote into a code block. Keep them one line each.
          ROWS=$(grep -c '^| ' "$R"); ROWS=$(( ROWS > 2 ? ROWS - 2 : 0 ))   # minus header + separator
          # An UNVERIFIABLE HOLD counts here too. A hold whose blocker could not be evaluated is
          # the same species of silence as an unreached probe -- if it did not count, the one
          # row-type this rewrite exists to expose would be the one type the banner ignores.
          FAILED=$(grep -c 'probe failed\|unreachable\|could not inspect\|hold unverified\|hold names no blocker' "$R" || true)
          if [ "$ROWS" -eq 0 ]; then
            BANNER=$(printf '> ❌ **SWEEP PRODUCED NO ROWS.** The report step ran but emitted nothing, so this body says\n> NOTHING about your pins — treat every verdict below as ABSENT, not as clean. Read the run log:\n> this is a bug in the reporter, not necessarily in a pin.')
          elif [ "$FAILED" -gt 0 ]; then
            BANNER=$(printf '> ⚠️ **SWEEP DEGRADED — %s of %s rows could not be verified this run.**\n> Those rows are **UNKNOWN — not "current", and not "safely held"**: a probe that never answered,\n> or a hold whose blocker could not be evaluated, cannot tell you a pin is where it should be.\n> Re-run before concluding anything about them. The canary line above is unaffected — it is what\n> says whether the pinned world still builds.' "$FAILED" "$ROWS")
          else
            BANNER=$(printf '**Probes:** all %s reached upstream this run.' "$ROWS")
          fi
          # awk, not a python heredoc: heredoc BODY lines would have to start in column 1, which
          # ends the YAML block scalar (this file broke that way twice while being written), and
          # indenting them to stay inside it makes the Python invalid. Passing the banner through
          # the ENVIRONMENT also sidesteps quoting it into an awk program, and carries its
          # embedded newlines intact.
          BANNER="$BANNER" awk '{ if ($0 == "<!--PROBE-BANNER-->") print ENVIRON["BANNER"]; else print }' "$R" > "$R.tmp" && mv "$R.tmp" "$R"
          echo "probe_failures=$FAILED" >> "$GITHUB_OUTPUT"
          echo "probe_rows=$ROWS"       >> "$GITHUB_OUTPUT"
          cat "$R"

      - name: Upsert the standing issue
        run: |
          set -euo pipefail
          TITLE="Weekly freshness report"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file report.md
            echo "updated issue #$NUM"
          else
            gh issue create --title "$TITLE" --body-file report.md
          fi

      - name: Open the draft KiCad-bump PR (dispatch-only, deliberate)
        if: github.event_name == 'workflow_dispatch' && inputs.bump_kicad && steps.report.outputs.kicad_latest != '' && steps.report.outputs.kicad_pin != steps.report.outputs.kicad_latest
        run: |
          set -euo pipefail
          PIN='${{ steps.report.outputs.kicad_pin }}'
          NEW='${{ steps.report.outputs.kicad_latest }}'
          BR="chore/kicad-digest-bump-${NEW:7:12}"
          git config user.name kibot-ci && git config user.email kibot-ci@users.noreply.github.com
          git checkout -b "$BR"
          # both workflows move together — the keep-in-step rule
          sed -i "s|$PIN|$NEW|g" .github/workflows/kibot.yml .github/workflows/consistency.yml .github/workflows/weekly-freshness.yml
          git commit -am "CI: bump pinned KiCad image digest (weekly-freshness dispatch)"
          git push -u origin "$BR"
          gh pr create --draft --title "CI: bump pinned KiCad image digest" --body \
            "Opened by weekly-freshness (dispatched with bump_kicad=true). Moves the pinned \`kicad10_auto_full\` digest in kibot.yml, consistency.yml and weekly-freshness.yml together (the keep-in-step rule). **The merge run's \`Generated/\` diff is this upgrade's blast radius — read it.** Note: this PR was opened with the workflow token, so its own CI will not start automatically; close/reopen it or push an empty commit to run checks pre-merge."
