# .github/workflows/kibot.yml — PCB CI for solar-business-card
# On every push touching PCB/: run ERC+DRC (intentional findings filtered) and
# regenerate fab zip, iBOM, board images, BOM/position docs into Generated/.
# The regenerated artifacts are committed back ONLY on main (the default branch),
# so the repo always carries current reports without feature branches diverging
# from main in Generated/ (which used to force a merge conflict on every PR).
# On a feature branch KiBot still runs as the ERC/DRC gate; it just does not commit.
name: PCB CI
 
on:
  push:
    paths:
      - 'PCB/**'
      - 'scripts/panelize.py'
      - '.github/workflows/kibot.yml'
 
permissions:
  contents: write
 
jobs:
  kibot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Run KiBot (KiCad 10)
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: PCB/solar-glow-drh.kibot.yaml
          dir: Generated
          board: PCB/solar-glow-drh-v4_0.kicad_pcb
          schema: PCB/solar-glow-drh-v4_0.kicad_sch
 
      # The PCBWay panel is DERIVED from the board above, never hand-maintained: it is the
      # board plus a frame, two routed slots, two break tabs and the hard-gold plating bus
      # that feeds them. See scripts/panelize.py for why it is a script and not a file.
      - name: Build the PCBWay panel
        run: |
          python3 -m pip install --quiet shapely
          python3 scripts/panelize.py

      - name: Run KiBot on the panel (fab set only)
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config: PCB/solar-glow-drh-panel.kibot.yaml
          dir: Generated/panel
          board: Generated/panel/solar-glow-drh-v4_0-panel.kicad_pcb

      # Presentation renders for the READMEs: the panel (both faces, as PCBWay ships it) and
      # the OSH Park "midnight" variant. Raytraced by kicad-cli, which the KiBot action does
      # not expose, so we borrow the same KiCad 10 image directly. --user keeps the PNGs
      # owned by the runner so the commit step below can stage them; HOME must be writable
      # for kicad-cli's config. ~90 s per face, 4 faces.
      - name: Render panel + midnight images
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/wk -w /wk \
            ghcr.io/inti-cmnb/kicad10_auto_full:latest \
            python3 scripts/render.py

      - name: Commit generated outputs
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "kibot-ci"
          git config user.email "kibot-ci@users.noreply.github.com"
          git add -A Generated
          git diff --cached --quiet || git commit -m "CI: regenerate fab + docs [skip ci]"
          git push
 
