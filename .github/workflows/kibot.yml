# .github/workflows/kibot.yml — PCB CI for solar-business-card
# On every push touching PCB/: run ERC+DRC (intentional findings filtered) and
# regenerate fab zip, iBOM, board images, BOM/position docs into Generated/ — and then
# the enclosure assembly views, which are textured with the card face this job just
# raytraced, so updating the board artwork updates the README hero in the same commit.
# The regenerated artifacts are committed back ONLY on main (the default branch),
# so the repo always carries current reports without feature branches diverging
# from main in Generated/ (which used to force a merge conflict on every PR).
# On a feature branch KiBot still runs as the ERC/DRC gate; it just does not commit.
name: PCB CI

on:
  push:
    paths:
      - 'PCB/**'
      # ...but not the prose in there. PCB/README.md and PCB/PCB-side-notes-brace-direction.md
      # are documentation that happens to live beside the board, and `PCB/**` was matching them:
      # merging #117, which changed CLAUDE.md and PCB/README.md and nothing else, kicked off the
      # full ~16 min pipeline and committed d570a72 -- 49 files whose entire content was plot
      # timestamps, re-zipped fab archives byte-identical in size, and one more roll of the
      # raytracer. No gerber geometry moved. That is CI cost and binary churn bought with a
      # sentence of prose, and it also falsely dates Generated/ to a run that regenerated nothing.
      # Negation must come AFTER the pattern it narrows; GitHub takes the last match.
      - '!PCB/**.md'
      - 'scripts/panelize.py'
      - 'scripts/render.py'
      # Board reference figures (LED polarity, SW2 bridge). Board edits already trigger via
      # PCB/**; this line is the generator's OWN edit -- the #132 lesson again.
      - 'scripts/ref_figures.py'
      # The assembly views are textured with the raytraced card face and read the board's
      # own outline, mounts and part positions, so they are a function of PCB/** too — they
      # are regenerated in this job, after the raytrace that produces their texture. These
      # extra paths are their NON-board inputs; a change to any of them makes the committed
      # views stale in exactly the way a board change does.
      - 'enclosure/assembly_render.py'
      - 'enclosure/fit_rules.py'
      - 'enclosure/board_parts.py'
      # part_heights feeds every brace pocket depth. It was missing here until 2026-08-01 --
      # the same gap class #132 closed for the generators: edit a height and nothing
      # regenerates, so the committed STL keeps cutting the old pocket.
      - 'enclosure/part_heights.py'
      # The CAD/drawing GENERATORS THEMSELVES, and medallion.py (the back medallion's
      # geometry + parameters, an input to the shell generator). These were missing until
      # 2026-07-31, and PR #129 (the medallion graduation) only regenerated because
      # fit_rules.py happened to be in the same diff. The concrete failure the gap
      # invited: bump medallion.SERIAL to "002" -- a one-line edit, the exact workflow
      # the parameter exists for -- and nothing regenerates, so the committed STEP
      # silently ships unit 001's number.
      - 'enclosure/medallion.py'
      - 'enclosure/solar-glow-drh-v3_0-backshell-0p6b-brace-cad.py'
      - 'enclosure/solar-glow-drh-v3_0-backshell-0p6b-brace-DRAWING-gen.py'
      - 'enclosure/brace/solar-glow-drh-diffuser-brace-cad.py'
      - 'enclosure/brace/solar-glow-drh-diffuser-brace-DRAWING-gen.py'
      # The pogo test plate has no other trigger: it is not consumed by the assembly
      # render, so an edit to its generator alone must regenerate its STEP/STL/drawing.
      - 'enclosure/solar-glow-drh-pogo-testplate-cad.py'
      # the mesh gate's ledger -- editing a baseline must re-prove it against the artifacts
      - 'scripts/check_mesh.py'
      - 'scripts/interference_drc.py'
      - 'enclosure/**.stl'
      - '.github/workflows/kibot.yml'

permissions:
  contents: write

# THE TOOLCHAIN IS PINNED BY DIGEST, and this is load-bearing rather than hygiene.
#
# This job's outputs are not just reports: DRC is a merge gate, and Generated/ is the
# gerber set that gets uploaded to a fab. Both are a function of the KiCad build that
# produced them, and the image behind `:latest` is a KiCad *testing* build
# (10.0.5-testing-188+202607221313). Floating it meant a new upstream push could change
# what DRC finds, or shift the plotted copper, with no commit in this repo to explain it.
# The digest below is the exact image that produced the Generated/ currently on main
# (run 30408694464, 2026-07-28) — verified against that run's `Digest:` line.
#
# To move it: change the digest here, push, and read the diff CI commits back to
# Generated/. That diff IS the toolchain upgrade's blast radius, which is the whole
# reason to pin — an unpinned upgrade produces the same diff with nothing to attribute
# it to. Keep it in step with .github/workflows/consistency.yml, which pins the same
# image for the same reason.
#
# The container runs as the runner (`-u $(id -u):$(id -g)`) so its output lands
# runner-owned and the commit step below can stage it, with HOME pointed somewhere
# writable for kibot/kicad-cli's config.
env:
  KICAD_IMAGE: ghcr.io/inti-cmnb/kicad10_auto_full@sha256:dd3b846da945f204fa7b61916df34a99170b2a2095b49c3879cd96d414b8a7b8

jobs:
  kibot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0

      # Provenance, printed once so a build log can be tied back to what produced it.
      # The KiBot action used to print this banner; we invoke the container directly
      # now (see below), so print it ourselves.
      - name: Toolchain provenance
        run: |
          echo "image: $KICAD_IMAGE"
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/wk -w /wk \
            "$KICAD_IMAGE" bash -c 'kibot --version; kicad-cli version'

      # WHY NOT `uses: INTI-CMNB/KiBot@v2_k10`:
      # that action is a Docker action whose Dockerfile is literally
      #   FROM ghcr.io/inti-cmnb/kicad10_auto_full:latest
      # and it exposes no way to choose a version — its `kicad:` input is commented out
      # upstream as "Currently impossible, too much limitations". So pinning the action to
      # a commit SHA would pin the wrapper and leave the actual KiCad floating, which is
      # the half that changes the outputs. Its entrypoint.sh is a thin argument shuffle
      # onto `kibot -c … -d … -b … -e …`, so calling the container directly loses nothing,
      # pins everything, and skips the ~45 s the runner spent rebuilding that Dockerfile.
      - name: Run KiBot (KiCad 10)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/wk -w /wk \
            "$KICAD_IMAGE" kibot \
              -c PCB/solar-glow-drh.kibot.yaml \
              -d Generated \
              -b PCB/solar-glow-drh-v4_0.kicad_pcb \
              -e PCB/solar-glow-drh-v4_0.kicad_sch

      # The PCBWay panel is DERIVED from the board above, never hand-maintained: it is the
      # board plus a frame, two routed slots, two break tabs and the hard-gold plating bus
      # that feeds them. See scripts/panelize.py for why it is a script and not a file.
      # shapely is pinned for the same reason the image is: it computes panel geometry that
      # ends up in the uploaded gerbers.
      - name: Build the PCBWay panel
        run: |
          python3 -m pip install --quiet 'shapely==2.1.2'
          python3 scripts/panelize.py

      # No schematic argument: the panel has none, and its config runs no ERC/DRC preflight
      # (see the header of solar-glow-drh-panel.kibot.yaml for why).
      - name: Run KiBot on the panel (fab set only)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/wk -w /wk \
            "$KICAD_IMAGE" kibot \
              -c PCB/solar-glow-drh-panel.kibot.yaml \
              -d Generated/panel \
              -b Generated/panel/solar-glow-drh-v4_0-panel.kicad_pcb

      # Presentation renders for the READMEs: the panel (both faces, as PCBWay ships it),
      # the depanelised card, the populated views and the OSH Park "midnight" variant.
      # Raytraced by kicad-cli. ~14 views, ~12 min.
      - name: Render panel, card, populated + midnight images
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/wk -w /wk \
            "$KICAD_IMAGE" python3 scripts/render.py

      # THE ENCLOSURE IS DOWNSTREAM OF THE BOARD, and until now nothing rebuilt it.
      #
      # Both bodies are COMPUTED from the board: fit_rules.py subtracts every part the brace
      # cannot span, scallops each M2 boss around whatever fouls it, and sizes the support lip
      # to clear the B-side pads -- all read out of the .kicad_pcb through board_parts.py. Move
      # a supercap and the brace footprint genuinely changes. Leaving that to a human rebuild is
      # the same failure mode as the stale drawings this repo already fixed once, except worse:
      # a stale brace is a part that gets PRINTED and does not fit.
      #
      # This runs BEFORE the assembly views on purpose -- those views load these exact STLs, so
      # rebuilding them afterwards would render the previous enclosure onto the current board.
      # ~6.7 min for both bodies plus both drawings and the pogo plate (was ~40 s until the
      # medallion graduated 2026-07-31; its boolean work dominates -- 6 m 42 s measured 2026-08-01).
      #
      # Both generators are also the reason to run this in CI at all: neither of them WORKED
      # until now. export_step_stable() handed cadquery a path ending ".tmp", which cannot infer
      # a format, so both died on their first STEP write. Nothing caught it because nothing ran
      # them. (The committed geometry was fine -- the STEP/STL come back byte-identical -- so the
      # breakage was in the export helper, not the parts.)
      - name: Regenerate the enclosure CAD and drawings
        run: |
          python3 -m pip install --quiet 'cadquery==2.8.0' 'matplotlib==3.11.1' 'shapely==2.1.2'
          python3 enclosure/brace/solar-glow-drh-diffuser-brace-cad.py
          python3 enclosure/solar-glow-drh-v3_0-backshell-0p6b-brace-cad.py
          python3 enclosure/brace/solar-glow-drh-diffuser-brace-DRAWING-gen.py
          python3 enclosure/solar-glow-drh-v3_0-backshell-0p6b-brace-DRAWING-gen.py
          python3 enclosure/solar-glow-drh-pogo-testplate-cad.py

      # Mesh validity gate (2026-08-01): the STLs the step above just wrote go to
      # FABRICATION, and a cadquery/OCC bump can emit a broken tessellation that every
      # downstream consumer (drawings, renders, the thickness figure) would swallow
      # silently. Gate BEFORE the commit-back: a broken mesh must fail this job, not
      # land on main. STEP validity is gated upstream at the B-rep level inside
      # export_step_stable (OCC BRepCheck -- the choke point all three generators use).
      # scripts/check_mesh.py carries the per-file ledger, incl. the shell's known
      # zero-length rim pinch; triangle count is deliberately not gated (not bit-stable).
      - name: Gate the generated meshes
        run: |
          python3 -m pip install --quiet 'trimesh==5.0.0'
          python3 scripts/check_mesh.py
          # the 3D interference DRC: ray-casts the brace STL written above against every
          # B-side body polygon + ledgered height -- the assembled boolean truth that
          # check [7] (one part at a time) cannot see. Fails BEFORE the commit-back.
          python3 scripts/interference_drc.py

      # Reference figures for PCB/README.md's assembly steps (D2-D5 LED polarity, the SW2
      # master bridge) plus the thickness-at-hand-scale figure, drawn FROM the board file
      # and the back-shell STL so they cannot silently disagree with either. The first two
      # replaced hand-uploaded v2-era PNGs (culled 2026-08-01) that had gone stale three
      # ways at once -- a ghost SJ1, pre-move SW2/R12 positions, dead net names -- with
      # nothing to notice. The script asserts the electrical story it tells (common anode
      # rail, R12 dim path) and fails this job if the board stops matching it. Runner-side:
      # matplotlib only, nothing KiCad. ~2 s.
      # ORDER IS LOAD-BEARING: this step sits AFTER the enclosure CAD step because the
      # thickness figure MEASURES the back-shell STL the step above just wrote (the
      # check-[7] philosophy -- measure the artifact, never restate the number). Before
      # the CAD and a shell-height edit would be figured at the previous revision for one
      # push -- the same one-revision lag the assembly-views ordering note below guards.
      - name: Draw the board reference figures
        run: |
          python3 -m pip install --quiet 'matplotlib==3.11.1'
          python3 scripts/ref_figures.py

      # THE HERO IS DOWNSTREAM OF THE ARTWORK, so it is regenerated here rather than by hand.
      # enclosure/assembly_render.py textures the assembled card with the raytraced card-face
      # plot the step above just wrote, and reads the outline, the eight mounts and every part
      # position out of the .kicad_pcb. Left to a human it silently goes on showing the previous
      # board — the same failure the front cartouche has a consistency check for. Running it
      # HERE, in the same job and the same commit as the texture it consumes, means the two can
      # never disagree: there is no window where Generated/docs is a revision ahead of the hero.
      #
      # Runner-side, not in the KiCad container: this is VTK/shapely, nothing to do with KiCad.
      # Deps are pinned for the reason everything else here is — these outputs get committed.
      # xvfb is belt-and-braces: the script asks for offscreen rendering and VTK will fall back
      # to it with no DISPLAY, but a real X server costs ~10 s and removes the question.
      - name: Render the enclosure assembly views
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          python3 -m pip install --quiet 'vtk==9.6.2' 'pillow==12.3.0' 'numpy==2.5.1' 'shapely==2.1.2'
          xvfb-run -a python3 enclosure/assembly_render.py

      - name: Commit generated outputs
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "kibot-ci"
          git config user.email "kibot-ci@users.noreply.github.com"

          # Everything this job owns. These sit beside the enclosure docs rather than under
          # Generated/, because that is where they are read from — but they are just as CI-owned.
          # Globbed by KIND rather than listed by name so a new variant out of the CAD generator
          # is picked up automatically; the patterns deliberately match no .py, .md or font, and
          # no hand-made image — of which enclosure/ now holds none: …-brace-fit.png, the last
          # one, a photo, was deleted as unreferenced. (This comment used to name …-brace-render.png alongside it as
          # hand-made — wrong on both counts: assembly_render.py writes it, and the
          # `enclosure/brace/*brace-render.png` pattern three lines up has always matched it.
          # Consistency check [9] now reads this OUTS list and cross-checks it, so the comment
          # and the globs cannot disagree silently again.) See enclosure/README.md.
          OUTS="Generated
                enclosure/*.step enclosure/*.stl
                enclosure/*-channels.json
                enclosure/*DRAWING.pdf enclosure/*DRAWING.png
                enclosure/solar-glow-drh-assembly*.gif
                enclosure/solar-glow-drh-assembly*.png
                enclosure/brace/*.step enclosure/brace/*.stl
                enclosure/brace/*DRAWING.pdf enclosure/brace/*DRAWING.png
                enclosure/brace/*pocket-map.png
                enclosure/brace/*brace-render.png"

          git add -A $OUTS
          git diff --cached --quiet && { echo "outputs already current"; exit 0; }
          git commit -m "CI: regenerate fab + docs [skip ci]"

          # This job takes ~16 min, so main can easily move underneath it -- merge two PRs
          # in one sitting and the second run's bare `git push` loses the race with
          # `! [rejected] main -> main (fetch first)`. That happened twice on 2026-07-28
          # and silently DROPPED both regenerations: the job goes red, nobody is watching a
          # post-merge run, and Generated/ quietly stays a revision behind.
          #
          # So we replay onto whatever main is now. The replay MUST rebuild the tree from
          # the new main, not merely re-parent our old one:
          #
          #   `git reset --soft` moves HEAD and leaves the INDEX alone, so the index still
          #   held this run's whole tree -- our checkout SHA plus Generated/. The
          #   `diff --cached` below then compared full trees rather than just Generated/,
          #   was non-empty *because of the other commit*, skipped the early exit, and
          #   committed a tree that SILENTLY REVERTED that merge -- under the message
          #   "CI: regenerate fab + docs [skip ci]", with [skip ci] so nothing re-ran.
          #   Reproduced verbatim, 2026-07-29: a real board edit merged during the run came
          #   back as its pre-merge content with the PR still shown as merged in the log.
          #
          # `reset --hard` + restoring the snapshot rebuilds the tree as (new main +
          # our Generated/), so the staged diff is Generated-only. That also keeps the early
          # exit below honest: it now fires exactly when main already carries these bytes.
          #
          # `rebase -X theirs` fixes the revert too, but not here: it leaves the commit
          # already made, so the early exit would `exit 0` without ever pushing -- a fresh
          # silent drop in place of the old one.
          #
          # Concurrency: groups do NOT solve this. They serialize workflow runs, and what
          # moves main is a human merge, which no group can serialize against a run already
          # in flight (checkout builds on github.sha, not the tip of main).
          # A tarball rather than `cp -a`, because the snapshot is no longer one directory:
          # it is Generated/ plus five files that live among hand-maintained ones, so the
          # restore has to put each back exactly where it came from without disturbing its
          # neighbours.
          snap="${RUNNER_TEMP:-/tmp}/ci-outputs.tar"
          # mkdir -p the parent: the step runs under `bash -e`, so a tar that fails here
          # would kill the step before it ever pushed.
          mkdir -p "$(dirname "$snap")"; rm -f "$snap"; tar -cf "$snap" $OUTS
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) -- replaying outputs onto current main"
            sleep $((attempt * 5))
            # Retry the fetch itself; falling through to the next attempt without it would
            # re-push the identical rejected commit and burn a slot for nothing.
            git fetch origin main || { sleep 5; git fetch origin main || continue; }
            git reset --hard origin/main
            # YIELD, don't replay, when the INPUTS moved underneath this run. The snapshot
            # holds outputs computed from THIS run's checkout; if main now carries a
            # different board or generator, a NEWER run owns these outputs, and restoring
            # ours would regress main to a stale worldview. Not hypothetical: the replay
            # resurrected 23 culled v3_0 files on 2026-07-31 (bc50e41 -- its snapshot
            # carried checkout-inherited files main had deleted), and on 2026-08-01 the
            # #149 run finished 27 s after #150's and replayed the C13 nudge OUT of the
            # committed fab set. Diffing only the INPUT paths keeps docs-only merges
            # replaying normally, mirroring the trigger list above (plus part_heights).
            if ! git diff --quiet ${{ github.sha }} origin/main -- \
                'PCB' ':(exclude)PCB/**.md' \
                scripts/panelize.py scripts/render.py scripts/ref_figures.py \
                enclosure/assembly_render.py enclosure/fit_rules.py enclosure/board_parts.py \
                enclosure/medallion.py enclosure/part_heights.py \
                enclosure/solar-glow-drh-v3_0-backshell-0p6b-brace-cad.py \
                enclosure/solar-glow-drh-v3_0-backshell-0p6b-brace-DRAWING-gen.py \
                enclosure/brace/solar-glow-drh-diffuser-brace-cad.py \
                enclosure/brace/solar-glow-drh-diffuser-brace-DRAWING-gen.py \
                enclosure/solar-glow-drh-pogo-testplate-cad.py \
                'enclosure/**.stl'; then
              echo "inputs moved under this run -- a newer run owns the outputs; yielding without committing"
              exit 0
            fi
            # rm Generated/ so a file this run deleted does not survive the restore; the five
            # assembly views are a fixed set, so extracting over them is enough.
            rm -rf Generated
            tar -xf "$snap"
            git add -A $OUTS
            git diff --cached --quiet && { echo "current main already has these outputs"; exit 0; }
            git commit -m "CI: regenerate fab + docs [skip ci]"
          done
          echo "::error::could not push generated outputs after 5 attempts"
          exit 1

