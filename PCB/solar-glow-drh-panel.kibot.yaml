# SOLAR-GLOW DRH v4.0 — KiBot config for the PCBWay FABRICATION PANEL
#
# Runs against Generated/panel/solar-glow-drh-v4_0-panel.kicad_pcb, which
# scripts/panelize.py derives from the committed board. Driven by the second KiBot
# step in .github/workflows/kibot.yml.
#
# Deliberately NOT a copy of solar-glow-drh.kibot.yaml:
#   * No ERC/DRC preflight. The panel has no schematic, so parity is meaningless, and
#     KiCad would flag the frame's plating bus as unconnected copper crossing the
#     outline at the tabs — which is the entire point of the panel. The board file is
#     where DRC is a gate; that gate already ran in the first KiBot step, on the same
#     copper. Panelising adds frame geometry, it does not move a single board object.
#   * No iBOM / pcbdraw / position files. Those describe the card, and the card's
#     versions are generated from the 1-up board. Duplicating them panel-shaped would
#     give two answers to one question.
#
# It DOES take check_zone_fills, and the reasoning above is exactly why that was missed:
# "panelising adds frame geometry, it does not move a single board object" is true and
# says nothing about zone FILLS, which are not objects panelize moves but state the board
# file carries. Without the preflight this config plots the board's STORED fill, so a zone
# whose fill is absent or stale reaches the fab as missing copper.
#
# Not theoretical, twice over. A pad moved by text surgery with stale fills left 6.9709 mm2
# of GND pour shorting SC4.P (net MID): the 1-up gerbers were clean because that config
# refills, and the panel carried the identical 6.9709 mm2. Then on 2026-08-09 the
# GND_B_AVR_ISLAND zone landed outline-only -- deliberately, since KiBot refills before
# plotting -- and the same regen moved 8,305 lines of the 1-up B.Cu gerber and FOUR lines
# of the panel's, all header. The island simply was not in the panel copper.
#
# Output of this config = the zip you actually upload to PCBWay, so of the two fab sets it
# is the one that must be right, and it was the one that was wrong.

kibot:
  version: 1

preflight:
  # Fill zones before plotting, then restore the source PCB -- same call and same reason as
  # the 1-up config. It cannot rewrite the panel board (which is a gitignored intermediate
  # anyway); it only makes the plotted copper match the routing.
  check_zone_fills: true

global:
  output: '%f-%i.%x'

outputs:
  - name: gerbers
    comment: Panel copper/mask/paste/silk/outline
    type: gerber
    dir: gerbers
    options:
      use_gerber_x2_attributes: true
      create_gerber_job_file: true
      tent_vias: true
    layers:
      - F.Cu
      - B.Cu
      - F.Mask
      - B.Mask
      - F.Paste
      - B.Paste
      - F.SilkS
      - B.SilkS
      - Edge.Cuts
      # The hard-gold plating area (drawn on the board by scripts/mask_art.py; the
      # panelizer carries every board drawing over, so the panel plots it too). The
      # bus ring on the frame rail is deliberately NOT in it — plating hardware,
      # not gold set — which this gerber now shows instead of only saying.
      - User.1

  - name: drill
    comment: Panel Excellon (the 8 mouse bites land in the NPTH file)
    type: excellon
    dir: gerbers
    options:
      pth_and_npth_single_file: false
      map: pdf

  - name: fab_zip
    comment: Upload-ready panel fab set
    type: compress
    dir: .
    options:
      files:
        - from_output: gerbers
        - from_output: drill
