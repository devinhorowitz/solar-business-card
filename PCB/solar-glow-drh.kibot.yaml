# SOLAR-GLOW DRH v3.0 — KiBot CI configuration
# Lives at PCB/solar-glow-drh.kibot.yaml; driven by .github/workflows/kibot.yml
kibot:
  version: 1

global:
  output: '%f-%i.%x'

preflight:
  # Fill zones before any layer operation, then leave the committed PCB untouched.
  # WHY THIS IS ON: KiBot builds `kicad-cli pcb drc --severity-all` with NO --refill-zones, so
  # without this it checks whatever fill was last SAVED. That made CI disagree with the board's own
  # documented check (`kicad-cli pcb drc --refill-zones ...` in CLAUDE.md) whenever copper moved and
  # the fills went stale -- a moved via reads as a clearance error against a pour that would have
  # receded on any refill. Enabling it also means the plotted gerbers carry current fills.
  # `check_zone_fills` (not `fill_zones`) is deliberate: it fills for the checks and restores the
  # original PCB, so CI never rewrites the board file.
  check_zone_fills: true
  erc:
    enabled: true
  drc:
    enabled: true
    # NO broad regex filters here — deliberately. There used to be two, for tracks_crossing
    # (the LA/LB coil junction) and copper_edge_clearance (the plating stubs at x=25.4). Both
    # were REDUNDANT and both were a masking risk:
    #
    #   Redundant, because kicad-cli reads only the .kicad_pro drc_exclusions, and a bare
    #   `kicad-cli pcb drc --severity-all` already returns every one of those findings with
    #   excluded=true. KiBot's filters only ever ADD exclusions on top (see kibot/pre_drc.py
    #   apply_filters), so deleting them changes nothing about what passes today — verified.
    #
    #   Dangerous, because they matched by error TYPE plus a generic message regex, not by
    #   instance. 'edge clearance' filtered EVERY copper_edge_clearance finding anywhere on the
    #   board, and 'Tracks crossing' every crossing. A new short at the board rim or a new
    #   crossing would have been swallowed in CI and nobody would have seen it.
    #
    # Every intentional finding is now excluded per-instance in .kicad_pro, keyed to the specific
    # objects. A NEW instance of any of these types now fails CI, which is the point.

outputs:
  - name: gerbers
    comment: Fabrication copper/mask/paste/silk/outline (KiCad plot engine)
    type: gerber
    dir: gerbers
    options:
      use_gerber_x2_attributes: true
      create_gerber_job_file: true
      tent_vias: true
    layers:
      - F.Cu
      - B.Cu
      - F.Mask
      - B.Mask
      - F.Paste
      - B.Paste
      - F.SilkS
      - B.SilkS
      - Edge.Cuts

  - name: drill
    comment: Excellon drill files (PTH + NPTH separate)
    type: excellon
    dir: gerbers
    options:
      pth_and_npth_single_file: false
      map: pdf

  - name: fab_zip
    comment: Single zip of gerbers + drills
    type: compress
    dir: .
    options:
      files:
        - from_output: gerbers
        - from_output: drill

  - name: ibom
    comment: Interactive HTML BOM for hand assembly
    type: ibom
    dir: docs
    options:
      dark_mode: true
      layer_view: B

  - name: board_images
    comment: Top/bottom board views
    type: pcbdraw
    dir: docs
    options:
      format: png
      bottom: false
  - name: board_images_bottom
    type: pcbdraw
    dir: docs
    options:
      format: png
      bottom: true

  - name: position
    comment: 'Pick+place CSV. CAUTION: the 13 exclude-from-position flags clear on schematic sync; this CI output is informational, the fab CPL follows the pre-order checklist.'
    type: position
    dir: fabdocs
    options:
      format: CSV
      units: millimeters

  - name: bom_csv
    comment: BOM snapshot, grouped by MPN (identical parts collapse to one line + qty)
    type: bom
    dir: fabdocs
    options:
      format: CSV
      # Group solely on MPN: same manufacturer part -> one line with a qty and the
      # refdes list. Every component carries a non-empty MPN (checked), so nothing
      # collapses by accident. Grouping on MPN alone (not also Value/Footprint) is
      # deliberate: identical parts still merge even if a footprint *field* drifts,
      # whereas the default Value+Footprint grouping would split them on that drift.
      group_fields: ['MPN']
      # Per-part distributor sourcing lives on each schematic symbol as
      # `Supplier` / `Supplier P/N` fields; kibot auto-includes user fields as BOM
      # columns (as it already does for MPN / Status), so the fab BOM now carries
      # the orderable distributor P/N per line. Supplier is DigiKey unless noted
      # (only U8 / AEM10300 is Mouser). Constant per MPN, so grouping is unaffected.
